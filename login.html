<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenSync | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="floating-leaf leaf1"></div>
    <div class="floating-leaf leaf2"></div>
    <div class="floating-leaf leaf3"></div>
    <div class="floating-leaf leaf4"></div>
    <div class="floating-leaf leaf5"></div>
    <div class="floating-leaf leaf6"></div>

    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-icon">🌿</div>
            <h2>Welcome Back!</h2>
            <p class="subtitle">Sign in to your GreenSync dashboard</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <div class="extra">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="js/main.js" defer></script>
    <script src="js/login.js" defer></script>
</body>
</html>
