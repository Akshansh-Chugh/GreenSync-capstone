<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenSync | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="floating-leaf leaf1"></div>
    <div class="floating-leaf leaf2"></div>
    <div class="floating-leaf leaf3"></div>
    <div class="floating-leaf leaf4"></div>
    <div class="floating-leaf leaf5"></div>
    <div class="floating-leaf leaf6"></div>

    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-icon">🌿</div>
            <h2>Welcome Back!</h2>
            <p class="subtitle">Sign in to your GreenSync dashboard</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-input" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-input" required>
                </div>

                <!-- ✅ NEW ROLE FIELD -->
                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role" class="form-input" required>
                        <option value="">Select Role</option>
                        <option value="owner">Owner</option>
                        <option value="co-owner">Co-owner</option>
                        <option value="caretaker">Caretaker</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
            </form>

            <div class="extra">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="js/main.js" defer></script>
    <script src="js/login.js" defer></script>
</body>
</html>
