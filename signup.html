<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenSync | Sign Up</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="floating-leaf leaf1"></div>
    <div class="floating-leaf leaf2"></div>
    <div class="floating-leaf leaf3"></div>
    <div class="floating-leaf leaf4"></div>
    <div class="floating-leaf leaf5"></div>
    <div class="floating-leaf leaf6"></div>

    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-icon">🌿</div>
            <h2>Create Account</h2>
            <p class="subtitle">Join GreenSync and start your green journey!</p>

            <form id="signupForm">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" class="form-input" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="greenthumb42" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm">Confirm</label>
                        <input type="password" id="confirm" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </form>

            <div class="extra">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </div>
    </div>

    <script src="js/main.js" defer></script>
    <script src="js/signup.js" defer></script>
</body>
</html>
